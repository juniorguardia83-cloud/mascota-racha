name: MimoPets Android APK

on:
  push:
    branches:
      - redesign/video-style-account-widget
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle assembleDebug

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \\
            --title "MimoPets ${VERSION}" \\
            --notes "Nueva actualización de MimoPets. Instala el APK para recibir las mejoras."

      - name: Register update in Supabase
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="1.0.${RUN_NUMBER}"
          APK_URL="https://github.com/${GH_REPOSITORY}/releases/download/v${VERSION}/app-debug.apk"
          BODY=$(jq -n --argjson code "$RUN_NUMBER" --arg version "$VERSION" --arg title "MimoPets ${VERSION}" --arg notes "Nueva versión disponible. Incluye mejoras y correcciones." --arg apk "$APK_URL" '{version_code:$code,version_name:$version,title:$title,notes:$notes,apk_url:$apk,is_published:true}')
          curl --fail --silent --show-error "${SUPABASE_URL}/rest/v1/app_updates" \\
            -X POST -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \\
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \\
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \\
            --data "$BODY"

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimoPets-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
