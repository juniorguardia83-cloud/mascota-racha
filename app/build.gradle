plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.mascotaracha'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mascotaracha'
        minSdk 23
        targetSdk 28
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }
}
