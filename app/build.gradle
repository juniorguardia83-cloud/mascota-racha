plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mascotaracha'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mascotaracha'
        minSdk 23
        targetSdk 28
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"
    }
}
